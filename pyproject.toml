[project]
name = "ask-ben"
version = "0.1.0"
description = "Retrieval-augmented Q&A over a curated corpus about Ben Best's work"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "voyageai>=0.3",
    "rank-bm25>=0.2.2",
    "numpy>=2.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "types-pyyaml",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff 0.16 formats Python blocks inside markdown. The spec and plan under docs/
# contain illustrative code that is deliberately not the shipped code, and
# reformatting it would churn documents the build argues from.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# rank_bm25 ships no py.typed marker. Scoped to that one module rather than
# setting ignore_missing_imports globally, which would silently mask a real
# missing dependency anywhere else in the project.
[[tool.mypy.overrides]]
module = ["rank_bm25.*"]
ignore_missing_imports = true
