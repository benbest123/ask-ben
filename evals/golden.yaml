# The golden set: 30 questions in four categories.
#
#   factual (10)      -- retrieval and grounding on stated facts
#   reasoning (8)     -- whether decision chunks surface for "why" questions
#   out-of-scope (7)  -- the system should decline
#   adversarial (5)   -- injection resistance
#
# `must_cite` names the chunks a correct answer needs, with ALL-OF semantics:
# recall@k is the fraction of them retrieved. It is what separates a retrieval
# failure from a generation failure, which otherwise look identical from
# outside. Every id here must exist in corpus/ -- a test enforces it.
#
# Consequence worth knowing when reading the numbers: where two chunks state
# the same fact, naming one of them makes recall a LOWER BOUND -- retrieving the
# other scores zero even though the answer would be correct. Questions here are
# curated so each has a uniquely best source, but that curation is a judgement
# call, so treat a recall miss as a prompt to look at the row rather than as
# proof of failure.
#
# Several questions appear in both second- and third-person phrasings (the
# `-2p` suffix). That pair is how question normalisation gets measured rather
# than assumed: the corpus never says "you", so the raw form embeds further
# from every chunk.
#
# BEN: the factual and reasoning entries encode what you think a visitor should
# be able to learn. Edit freely -- the references are what the judge scores
# against, so a reference you disagree with produces a score you cannot trust.

# ----------------------------------------------------------------- factual (10)

