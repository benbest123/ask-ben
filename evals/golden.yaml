# --------------------------------------------------------------- reasoning (8)

- id: reasoning-iam-isolation
  category: reasoning
  question: Why did he not just filter by partner in the query?
  expected: answer
  must_cite: [visa-isolation-in-iam-not-code]
  reference: >
    Because application-level filtering puts isolation somewhere a bug can cross it -- the
    code has permission to read everything, so a mistaken join silently produces a wrong
    number. In IAM and KMS the same mistake fails loudly instead.

- id: reasoning-race-condition
  category: reasoning
  question: Tell me about a bug he got wrong the first time.
  expected: answer
  must_cite: [visa-polling-to-timestamp]
  reference: >
    A race condition in an async provisioning flow at Visa. He first tried polling, which
    only made the symptom rarer, because polling answers "is it ready now" and a race is a
    question about ordering. A timestamp-based heuristic addressed the ordering directly.

- id: reasoning-csp
  category: reasoning
  question: Why was the CSP migration slow?
  expected: answer
  must_cite: [visa-csp-not-widened]
  reference: >
    Because he established what each of about twenty-five dashboards genuinely needed rather
    than widening the policy until the console errors stopped. A policy relaxed to silence a
    warning gives no protection while still passing an audit.

- id: reasoning-no-vector-db
  category: reasoning
  question: Why does this widget not use a vector database?
  expected: answer
  must_cite: [askben-no-vector-db]
  reference: >
    Around thirty chunks at 1024 dimensions is roughly 120KB, and brute-force comparison
    against all of them is a single matrix multiply. Approximate search exists to avoid
    comparing against everything, which at this size is already the fast path.

- id: reasoning-no-vector-db-2p
  category: reasoning
  question: Why didn't you use a vector database?
  expected: answer
  must_cite: [askben-no-vector-db]
  reference: >
    Same as reasoning-no-vector-db, phrased in the second person: the corpus is small enough
    that a dot product beats an index, so a database would be infrastructure with nothing
    to do.

- id: reasoning-no-orm
  category: reasoning
  question: Why did he write raw SQL for Snip instead of using an ORM?
  expected: answer
  must_cite: [snip-no-orm]
  reference: >
    To own the schema and the query plan rather than inherit them, which was the point of the
    project. He is explicit that the cost is boilerplate and no protection against a
    mistyped column until runtime, and that a large team would flip the decision.

- id: reasoning-black-box
  category: reasoning
  question: How do you replace a system nobody understands?
  expected: answer
  must_cite: [visa-reconciling-a-black-box]
  reference: >
    The target is not a correct pipeline, because there is no independent definition of
    correct. It is a pipeline whose every difference from the old one can be explained --
    each discrepancy is a question about which system was wrong, not a defect.

- id: reasoning-window-manager
  category: reasoning
  question: What is actually interesting about his personal site, technically?
  expected: answer
  must_cite: [personal-site-window-manager]
  reference: >
    The window manager is a pure reducer. Z-order, focus, what happens to focus when the
    focused window is minimised, and how a drag interacts with all of it are easy to get
    subtly wrong; modelling it as state-and-action makes those cases testable directly.

