name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Types
        run: mypy
      # Tests must pass with no API keys present. Every Anthropic and Voyage
      # call is mocked; a test that needs a key is a test that cannot gate a PR.
      - name: Tests
        run: pytest

  # Closes the standard RAG failure mode: corpus and index drift apart, and
  # retrieval quietly starts answering from stale text with no error anywhere.
  # Rebuilds only corpus.json -- embeddings need a key and a remote model offers
  # no byte-reproducibility guarantee, so this covers chunk content and ordering,
  # which is where drift actually happens.
  index-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Rebuild corpus.json from corpus/ and diff it
        run: |
          python -m ask_ben.ingest --records-only
          git diff --exit-code -- index/corpus.json
